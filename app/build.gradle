plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    // Enables the JUnit 5 Platform for local unit tests (required by jqwik property tests)
    id 'de.mannodermaus.android-junit5'
}

android {
    namespace 'com.examscanner.premium'
    compileSdk 34

    defaultConfig {
        applicationId "com.examscanner.premium"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Export Room schemas so migrations (v1 -> v2) can be validated by tests.
        // Pairs with exportSchema = true on the @Database class.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Expose exported Room schemas to instrumentation tests (MigrationTestHelper reads them from assets).
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // AppCompat provides AppCompatDelegate.setApplicationLocales + LocaleListCompat
    // for per-app locale switching without restart (Req 20.3, LocalizationManager)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    
    // Room Database with SQLCipher encryption
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    
    // SQLCipher for database encryption
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'
    
    // CameraX
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    
    // ML Kit
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // ML Kit Barcode Scanning for QR code detection on scanned answer sheets
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    
    // Accompanist Permissions
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'
    
    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'
    
    // ZXing for QR code generation and scanning
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:android-core:3.3.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Apache POI for .xlsx (Excel) import/export of results, rosters, and MELC mastery
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Google Play Billing for subscription tier management
    implementation 'com.android.billingclient:billing-ktx:7.1.1'
    
    // Firebase (for authentication only - no live sync)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'  // Used for user profiles only
    
    // Coroutines for Firebase
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    
    // Lifecycle for ProcessLifecycleOwner
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    
    // DataStore for preferences
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    
    // Security library for encrypted shared preferences (stable version)
    implementation 'androidx.security:security-crypto:1.0.0'

    // Biometric / device-credential authentication gate for student records (Req 8.7, 13.2).
    // Pinned to 1.1.0: last stable release, compatible with compileSdk 34 / minSdk 26.
    // BiometricPrompt requires the host activity to be a FragmentActivity (see MainActivity).
    implementation 'androidx.biometric:biometric:1.1.0'

    // WorkManager for background jobs (daily recycle-bin purge, Task 13.4 / Req 10.6)
    // Pinned to 2.9.1: 2.10.x requires compileSdk 35 while this project targets 34 (AGP 8.2.0).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // ---- Unit testing (JUnit 5 platform + jqwik property tests) ----
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.0'
    // Keep JUnit 4 API available (vintage engine) for any existing JUnit 4 tests
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.0'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.0'
    // jqwik for property-based testing (design Correctness Properties)
    testImplementation 'net.jqwik:jqwik:1.9.1'
    // Real org.json on the JVM unit-test classpath so QRCodeGenerator.ExamMetadata
    // toJson()/fromJson() (which use org.json) run for real instead of the stubbed
    // "not mocked" Android framework version. Standard, tiny, pinned dependency.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // ---- Instrumentation testing (Room migration tests) ----
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Compose BOM must be on the androidTest classpath too, otherwise the unversioned
    // ui-test-junit4 artifact below cannot be resolved.
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
